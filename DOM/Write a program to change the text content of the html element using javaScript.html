### Program: Change Text Content of HTML Element Using JavaScript

```htm
<!DOCTYPE html>
<html>
<head>
    <title>Change Text Content</title>
</head>
<body>

    <h2 id="heading">Hello World!</h2>

    <button onclick="changeText()">Change Text</button>

    <script>
        function changeText()
        {
            document.getElementById("heading").textContent = "Text Changed Successfully!";
        }
    </script>

</body>
</html>
```
