
<!DOCTYPE html>
<html>
<head>
    <title>Remove CSS Class</title>

    <style>
        .highlight {
            color: red;
            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2 id="heading" class="highlight">Hello World!</h2>

    <button onclick="removeClass()">Remove Class</button>

    <script>
        function removeClass()
        {
            document.getElementById("heading").classList.remove("highlight");
        }
    </script>

</body>
</html>
